name: KeyAuth

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: org.kakahu.KeyAuth
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    KEYAUTH_CLOUD_CONTAINER: iCloud.org.kakahu.KeyAuth
    DEVELOPMENT_TEAM: 5C6T6Y2Y22
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

  configs:
    Debug:
      KEYAUTH_CLOUD_ENVIRONMENT: Development
    Release:
      KEYAUTH_CLOUD_ENVIRONMENT: Production

targets:
  KeyAuth:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    sources:
      - path: Cloud
      - path: Models
      - path: OTP
      - path: Security
      - path: Store
      - path: Views
      - path: KeyAuthApp.swift
      - path: Assets.xcassets
      - path: Localization
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: KeyAuth uses the camera to scan TOTP QR codes.
        NSFaceIDUsageDescription: KeyAuth uses Face ID or your device passcode to protect verification codes.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: KeyAuth.entitlements
      properties:
        com.apple.developer.icloud-container-environment: $(KEYAUTH_CLOUD_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - $(KEYAUTH_CLOUD_CONTAINER)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
